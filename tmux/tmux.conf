# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -sg escape-time 0
set -g default-editor nvim
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g display-panes-time 2000
set -g repeat-time 1000
set -g status-position top
set -g allow-passthrough on

# Status bar
set -g status-style bg=default
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right ""
setw -g automatic-rename on

# Pane borders
set -g pane-active-border-style fg=#a6e3a1,bg=default
set -g pane-border-style fg=#6c7086,bg=default

# Status left: session name, color reflects mode (prefix/copy/normal)
set -g status-left "#{?client_prefix,#[fg=#f38ba8 bold],#{?pane_in_mode,#[fg=#f9e2af bold],#[fg=#a6e3a1 bold]}}  #S"

# Window status
set -g window-status-format "#[fg=#b4befe] #I:#W#{?window_zoomed_flag, 󰁌,}"
set -g window-status-current-format "#[fg=#fab387] #I:#W#{?window_zoomed_flag, 󰁌,}"

# Messages / command prompt / mode
set -g message-command-style bg=default,fg=#b4befe
set -g message-style bg=default,fg=#b4befe
set -g mode-style bg=#313244,fg=#94e2d5

# Copy mode (vi)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi _ send-keys -X start-of-line
bind -T copy-mode-vi '$' send-keys -X end-of-line
bind P paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits (keep cwd)
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move windows
bind -n C-S-Left { swap-window -t -1; select-window -t -1 }
bind -n C-S-Right { swap-window -t +1; select-window -t +1 }

# QoL
bind x kill-pane
bind Tab last-window
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# TPM bootstrap
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{XDG_DATA_HOME}/tmux/plugins/'
if "test ! -d '#{XDG_DATA_HOME}/tmux/plugins/tpm'" {
  run "mkdir -p '#{XDG_DATA_HOME}/tmux/plugins/'"
  run "git clone https://github.com/tmux-plugins/tpm '#{XDG_DATA_HOME}/tmux/plugins/tpm'"
  run "'#{XDG_DATA_HOME}/tmux/plugins/tpm/bin/install_plugins'"
}

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run -b '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
