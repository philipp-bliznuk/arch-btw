# kitty.conf - mirrors ghostty/config (Catppuccin Mocha, JetBrainsMono Nerd Font)
# Docs: /usr/share/doc/kitty/html/conf.html  |  reload: ctrl+shift+f5

### Font
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Ligatures on, except under the cursor so the glyph you edit stays readable
disable_ligatures cursor
# Crisp text on non-HiDPI panels (replaces ghostty font-thicken)
text_composition_strategy 1.2 0

### Cursor
cursor                 #b4befe
cursor_text_color      background
cursor_shape           block
cursor_shape_unfocused hollow
cursor_blink_interval  0
# Smooth cursor movement trail (was in mac config)
cursor_trail           3
cursor_trail_decay     0.1 0.4
cursor_trail_start_threshold 2
shell_integration      enabled no-cursor

### Scrollback
scrollback_lines            10000
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes

### Mouse / clipboard
mouse_hide_wait          0
copy_on_select           no
strip_trailing_spaces    smart
clipboard_control        write-clipboard write-primary read-clipboard-ask read-primary-ask
url_style                curly
detect_urls              yes
show_hyperlink_targets   yes
allow_hyperlinks         yes

### Performance
repaint_delay   8
input_delay     2
sync_to_monitor yes

### Window
remember_window_size    yes
resize_in_steps         yes
window_padding_width    4
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
visual_bell_duration    0.0
linux_display_server    wayland
wayland_enable_ime      yes
# Distro build already skips this; explicit anyway
update_check_interval   0

### Tabs (sway/tmux handle layout; keep bar hidden)
tab_bar_style hidden

### Advanced
allow_remote_control socket-only
listen_on              unix:@kitty
notify_on_cmd_finish   invisible 5.0 notify
term                   xterm-kitty

### Keys
clear_all_shortcuts no
# Ghostty had super+r reload; kitty uses ctrl+shift+f5 - keep both
map super+r         load_config_file
map ctrl+shift+f5   load_config_file
# Shift+Enter as CSI-u so tmux/zsh/nvim can bind it (kitty keyboard protocol)
map shift+enter     send_text all \x1b[13;2u
# Window / tab mgmt is sway's and tmux's job - drop kitty's own
map ctrl+shift+enter no_op
map ctrl+shift+n     no_op
map ctrl+shift+t     no_op
map ctrl+shift+q     no_op
map ctrl+shift+w     no_op
map ctrl+shift+right no_op
map ctrl+shift+left  no_op
map ctrl+shift+l     no_op

