# kitty.conf - Catppuccin Mocha, JetBrainsMono Nerd Font
# Docs: /usr/share/doc/kitty/html/conf.html  |  reload: ctrl+shift+f5

### Font
font_family JetBrainsMono Nerd Font Mono
# Ligatures on, except under the cursor so the glyph you edit stays readable
disable_ligatures cursor
# Crisp text on non-HiDPI panels
text_composition_strategy 1.2 0

### Cursor
cursor                #b4befe
cursor_text_color     background
cursor_blink_interval 0
cursor_trail          3
shell_integration     enabled no-cursor

### Scrollback
scrollback_lines                10000
scrollback_fill_enlarged_window yes

### Mouse / clipboard
mouse_hide_wait        0
strip_trailing_spaces  smart
show_hyperlink_targets yes

### Performance
repaint_delay 8
input_delay   2

### Window
resize_in_steps         yes
window_padding_width    4
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
linux_display_server    wayland

### Tabs (sway/tmux handle layout; keep bar hidden)
tab_bar_style hidden

### Advanced
allow_remote_control socket-only
listen_on            unix:@kitty
notify_on_cmd_finish invisible 5.0 notify

### Keys - windows, tabs, scrolling and font size are sway's and tmux's job
clear_all_shortcuts yes
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
map ctrl+shift+f5 load_config_file

### Colors - Catppuccin Mocha (no kitty windows, tabs or marks: those colours are left out)
