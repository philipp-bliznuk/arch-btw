# Replaces /usr/share/xdg-desktop-portal/sway-portals.conf (the first file
# found wins whole, so sway's lines are repeated here).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# gtk's Inhibit needs org.gnome.SessionManager; without it Firefox uses
# Wayland's idle-inhibit protocol, which sway implements.
org.freedesktop.impl.portal.Inhibit=none
# A host app (anything not in a Flatpak or an app-*.scope, the firejailed
# browser included) installs launchers without a dialog and may overwrite any
# ~/.local/share/applications/*.desktop. Nothing here uses it.
org.freedesktop.impl.portal.DynamicLauncher=none
