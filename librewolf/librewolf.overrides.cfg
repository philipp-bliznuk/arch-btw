// Read by LibreWolf's librewolf.cfg after its own defaults (defaultPref: the
// user's about:config choices still win). post-install.sh (librewolf) links
// it to ~/.config/librewolf/librewolf/librewolf.overrides.cfg.

// librewolf.cfg upgrades private network addresses to HTTPS as well (loopback
// is always exempt); homelab services speak plain HTTP, so IP literals in
// private and link-local ranges load as typed (Firefox's default). The
// internet is still HTTPS-Only. A per-site exception would cover one host at
// a time; several services on several ports made the global switch cheaper.
// Cost: on a hostile LAN a typed http://10.x or http://192.168.x URL is not
// upgraded; https:// URLs are unaffected.
defaultPref("dom.security.https_only_mode.upgrade_local", false);
defaultPref("network.http.referer.XOriginPolicy", 2);
defaultPref("media.autoplay.blocking_policy", 2);
// LibreWolf's compiled default (StaticPrefs, lw-staticprefs.patch) is true:
// a site asking for WebGL gets only the URL-bar icon and stays blocked until
// that is clicked. false shows the doorhanger, so the question is visible.
defaultPref("librewolf.webgl.prompt.hide", false);
// Hardware video decode via VA-API (intel-media-driver / libva-mesa-driver);
// Firefox 160 has VA-API on by default (media.ffmpeg.vaapi.enabled is gone),
// force-enabled skips its driver block list. AV1 off: pre-Tiger-Lake iGPUs
// lack an AV1 decoder, and sites pick AV1 when offered, which means software
// decode. Disabling it makes them serve VP9/H.264 instead.
defaultPref("media.hardware-video-decoding.force-enabled", true);
defaultPref("media.av1.enabled", false);
// Extension base CSP: no remote script or plugin in extension pages (Firefox's
// MV3 default, applied to MV2 extensions too). default-src 'none' on top would
// also block connect-src, i.e. uBlock Origin's filter-list updates.
defaultPref("extensions.webextensions.base-content-security-policy",
            "script-src 'self' 'wasm-unsafe-eval'; object-src 'self';");
// librewolf.cfg clears cookies and site data at exit (sanitizeOnShutdown with
// every item but history), so each browser start logged every profile out of
// every site. Cookies stay, the cache still goes. Session-only cookies die
// regardless (browser.sessionstore.privacy_level 2 in librewolf.cfg): a site
// that logs out anyway after this gets that pref next.
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
// Sessions come back on every start. Firefox restores on its own only after
// an unclean end (browser.startup.page 1); after a normal quit the session is
// kept for the History menu alone, and the crash path has a gate of its own:
// about:sessionrestore instead of the tabs after the second unclean end in a
// row or for a session older than six hours, a count only a clean quit resets.
// Both bit here. Firefox's SIGTERM handler (nsAppShell TermSignalHandler) only
// stops the event loop: no quit path, no final session write, so every quit by
// $mod+Ctrl+q (qs-quit sends SIGTERM) and every poweroff with the browser open
// counted as a crash. 3 restores after a quit, and SessionStartup checks it
// before the crash path, so a crashed session comes back the same way, without
// the page. A SIGTERM still loses the writes since the last 15 s interval
// (browser.sessionstore.interval): quit LibreWolf by closing its window.
defaultPref("browser.startup.page", 3);

// --- UI: dark Catppuccin shell, compact, nothing in the way -----------------
// Looks only. privacy.resistFingerprinting and everything it covers (content
// colour scheme, fonts, window size rounding) stay as librewolf.cfg sets them;
// the colours come from chrome/userChrome.css and chrome/userContent.css,
// which the next pref lets a profile load (post-install.sh links the repo's
// chrome/ into every profile).
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// Compact density (1) and its switch in the customize palette.
defaultPref("browser.uidensity", 1);
defaultPref("browser.compactmode.show", true);
// 0: the window has no client-side title bar; sway draws its 1 px border and
// nothing else (default_border pixel 1). userChrome.css hides the CSD buttons
// as well, in case a build decides otherwise.
defaultPref("browser.tabs.inTitlebar", 0);
// Tabs live in Sidebery (policies.d.json installs it); the bookmarks toolbar
// goes, the sidebar launcher of the revamp loses its animation (hidden by
// userChrome.css), tab previews and tab groups are off (Sidebery has its own
// tree). sidebar.verticalTabs stays false: Firefox's own vertical tabs would
// sit next to Sidebery's.
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("sidebar.animation.enabled", false);
defaultPref("browser.tabs.hoverPreview.enabled", false);
defaultPref("browser.tabs.groups.enabled", false);
// URL bar: no shortcut buttons under the dropdown, no quick actions, no top
// sites on focus (the sponsored and suggestion feeds are already off in
// librewolf.cfg).
defaultPref("browser.urlbar.shortcuts.bookmarks", false);
defaultPref("browser.urlbar.shortcuts.history", false);
defaultPref("browser.urlbar.shortcuts.tabs", false);
defaultPref("browser.urlbar.shortcuts.actions", false);
defaultPref("browser.urlbar.suggest.quickactions", false); // the pref ActionsProviderQuickActions reads; quickactions.enabled is defined but unread
defaultPref("browser.urlbar.suggest.topsites", false);
defaultPref("browser.aboutConfig.showWarning", false);
